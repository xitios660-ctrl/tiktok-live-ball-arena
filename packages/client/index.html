<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Ball Arena Overlay</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bevan&family=Bebas+Neue&family=Inter:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --arena-red: #ff4e45;
        --ember-orange: #ff8a3d;
        --arena-gold: #ffd166;
        --electric-cyan: #22d3ee;
        --arena-dark: #0b0b0f;
        --stone: #1e1a16;
        --ui-steel: #2e3440;
        --text-light: #f2ebd7;
        --font-ui: Inter, system-ui, sans-serif;
        --font-display: Bevan, Georgia, serif;
        --font-accent: "Bebas Neue", Inter, sans-serif;
      }
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        width: 100dvw;
        height: 100%;
        height: 100dvh;
        max-width: 100%;
        max-height: 100%;
        background: var(--arena-dark);
        overflow: hidden;
        touch-action: none;
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
        overscroll-behavior: none;
        font-family: var(--font-ui);
        /* iOS Safari visualViewport sync (set by main.ts) */
        --vvw: 100dvw;
        --vvh: 100dvh;
        --vv-left: 0px;
        --vv-top: 0px;
      }
      body {
        position: fixed;
        inset: 0;
        width: var(--vvw);
        height: var(--vvh);
        left: var(--vv-left);
        top: var(--vv-top);
        display: flex;
        align-items: center;
        justify-content: center;
        padding:
          env(safe-area-inset-top, 0)
          env(safe-area-inset-right, 0)
          env(safe-area-inset-bottom, 0)
          env(safe-area-inset-left, 0);
        box-sizing: border-box;
      }
      #game-container {
        width: 100%;
        height: 100%;
        max-width: 100%;
        max-height: 100%;
        margin: 0;
        background: var(--arena-dark);
        position: relative;
        overflow: hidden;
        box-sizing: border-box;
      }
      #game-container canvas {
        display: block;
        margin: 0 auto;
      }
      /*
       * ?spin=1 / ?rotate=1 / ?fill=landscape — when viewport is landscape,
       * rotate the portrait (1080×1920) canvas 90° so it fills the phone.
       * Phaser parent box stays portrait-shaped (pre-transform) for Scale.FIT.
       */
      html.spin-fill.spin-landscape body {
        padding: 0;
      }
      html.spin-fill.spin-landscape #game-container {
        position: absolute;
        left: 50%;
        top: 50%;
        width: var(--vvh);
        height: var(--vvw);
        max-width: none;
        max-height: none;
        transform: translate(-50%, -50%) rotate(90deg);
        transform-origin: center center;
      }
      html.obs-transparent,
      body.obs-transparent,
      #game-container.obs-transparent {
        background: transparent !important;
      }
      html.obs-transparent body {
        background: transparent !important;
      }

      /* Audio unlock gate — visible CTA until first tap (autoplay policy) */
      #audio-unlock-gate {
        position: fixed;
        inset: 0;
        width: var(--vvw, 100%);
        height: var(--vvh, 100%);
        left: var(--vv-left, 0);
        top: var(--vv-top, 0);
        z-index: 99999;
        display: flex;
        align-items: flex-end;
        justify-content: center;
        padding: 0 16px calc(28px + env(safe-area-inset-bottom, 0));
        box-sizing: border-box;
        pointer-events: auto;
        cursor: pointer;
        background: radial-gradient(ellipse at center, rgba(11, 11, 15, 0.35) 0%, rgba(11, 11, 15, 0.72) 100%);
        -webkit-tap-highlight-color: transparent;
      }
      #audio-unlock-gate.hidden {
        display: none;
        pointer-events: none;
      }
      #audio-unlock-gate .gate-card {
        width: min(520px, 100%);
        padding: 22px 28px 24px;
        border-radius: 18px;
        background: linear-gradient(145deg, rgba(30, 26, 22, 0.92), rgba(11, 11, 15, 0.88));
        border: 1.5px solid rgba(34, 211, 238, 0.55);
        box-shadow:
          0 0 24px rgba(34, 211, 238, 0.35),
          0 0 48px rgba(255, 209, 102, 0.18),
          inset 0 1px 0 rgba(255, 255, 255, 0.08);
        text-align: center;
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        animation: gate-pulse 2.2s ease-in-out infinite;
      }
      #audio-unlock-gate .gate-title {
        margin: 0;
        font-family: var(--font-accent);
        font-size: clamp(22px, 5.5vw, 32px);
        letter-spacing: 0.06em;
        color: var(--arena-gold);
        text-shadow:
          0 0 12px rgba(34, 211, 238, 0.65),
          0 0 28px rgba(255, 209, 102, 0.4),
          0 2px 4px #000;
      }
      #audio-unlock-gate .gate-sub {
        margin: 8px 0 0;
        font-family: var(--font-ui);
        font-size: clamp(12px, 3vw, 14px);
        font-weight: 600;
        color: rgba(242, 235, 215, 0.78);
        letter-spacing: 0.02em;
      }
      @keyframes gate-pulse {
        0%, 100% { box-shadow: 0 0 24px rgba(34, 211, 238, 0.35), 0 0 48px rgba(255, 209, 102, 0.18), inset 0 1px 0 rgba(255, 255, 255, 0.08); border-color: rgba(34, 211, 238, 0.55); }
        50% { box-shadow: 0 0 36px rgba(34, 211, 238, 0.55), 0 0 64px rgba(255, 209, 102, 0.32), inset 0 1px 0 rgba(255, 255, 255, 0.1); border-color: rgba(255, 209, 102, 0.7); }
      }
    </style>
  </head>
  <body>
    <div id="game-container"></div>
    <div id="audio-unlock-gate" role="button" aria-label="Toque para ativar o som">
      <div class="gate-card">
        <p class="gate-title">🔊 TOQUE PARA ATIVAR O SOM</p>
        <p class="gate-sub">precisa de um toque no celular</p>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
