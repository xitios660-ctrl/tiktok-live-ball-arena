<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Ball Arena Overlay</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bevan&family=Bebas+Neue&family=Inter:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --arena-red: #ff4e45;
        --ember-orange: #ff8a3d;
        --arena-gold: #ffd166;
        --electric-cyan: #22d3ee;
        --arena-dark: #0b0b0f;
        --stone: #1e1a16;
        --ui-steel: #2e3440;
        --text-light: #f2ebd7;
        --font-ui: Inter, system-ui, sans-serif;
        --font-display: Bevan, Georgia, serif;
        --font-accent: "Bebas Neue", Inter, sans-serif;
      }
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        height: 100dvh;
        background: var(--arena-dark);
        overflow: hidden;
        touch-action: none;
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
        overscroll-behavior: none;
        font-family: var(--font-ui);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding:
          env(safe-area-inset-top, 0)
          env(safe-area-inset-right, 0)
          env(safe-area-inset-bottom, 0)
          env(safe-area-inset-left, 0);
        box-sizing: border-box;
      }
      #game-container {
        width: 100%;
        height: 100%;
        max-width: 100%;
        max-height: 100%;
        margin: 0;
        background: var(--arena-dark);
        position: relative;
        overflow: hidden;
      }
      #game-container canvas {
        display: block;
        margin: 0 auto;
      }
      html.obs-transparent,
      body.obs-transparent,
      #game-container.obs-transparent {
        background: transparent !important;
      }
      html.obs-transparent body {
        background: transparent !important;
      }
    </style>
  </head>
  <body>
    <div id="game-container"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
