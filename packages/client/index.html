<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, initial-scale=1" />
    <title>Ball Arena Overlay</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background: #000;
        overflow: hidden;
        width: 100%;
        height: 100%;
      }
      #game-container {
        width: 1080px;
        height: 1920px;
        margin: 0 auto;
        background: #000;
      }
      /* OBS Browser Source: ?transparent=1 or ?bg=transparent */
      html.obs-transparent,
      body.obs-transparent,
      #game-container.obs-transparent {
        background: transparent !important;
      }
      html.obs-transparent body {
        background: transparent !important;
      }
    </style>
  </head>
  <body>
    <div id="game-container"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
