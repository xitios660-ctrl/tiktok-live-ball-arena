<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>Arena Admin — DEMO</title>
  <style>
    :root {
      --bg:#0f1115; --card:#1a1d24; --accent:#fe2c55; --ok:#20d68a;
      --text:#e8eaed; --muted:#9aa0a6; --tap:44px;
      --safe-t: env(safe-area-inset-top, 0px);
      --safe-b: env(safe-area-inset-bottom, 0px);
      --safe-l: env(safe-area-inset-left, 0px);
      --safe-r: env(safe-area-inset-right, 0px);
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin:0; font-family: system-ui, -apple-system, sans-serif;
      background:var(--bg); color:var(--text);
      padding: 12px;
      padding-top: calc(12px + var(--safe-t));
      padding-bottom: calc(16px + var(--safe-b));
      padding-left: calc(12px + var(--safe-l));
      padding-right: calc(12px + var(--safe-r));
      max-width: 100vw;
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
    }
    .topbar {
      position: sticky; top: 0; z-index: 40;
      background: rgba(15,17,21,.94);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      margin: -12px -12px 12px;
      padding: 10px 12px 12px;
      padding-top: calc(10px + var(--safe-t));
      border-bottom: 1px solid #2a2f3a;
    }
    .topbar h1 { font-size:1.2rem; margin:0 0 4px; line-height:1.25; }
    .sub { color:var(--muted); margin:0 0 8px; font-size:.85rem; line-height:1.4; word-break: break-word; }
    .badges { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px; }
    .badge { display:inline-block; padding:4px 10px; border-radius:999px; background:#333; font-size:.75rem; }
    .badge.demo { background:#3d2a00; color:#ffb020; }
    .quick { display:flex; flex-wrap:wrap; gap:8px; }
    .quick button { flex: 1 1 auto; min-width: calc(50% - 8px); }
    @media (min-width: 520px) {
      .quick button { min-width: 0; flex: 0 1 auto; }
    }
    .grid {
      display:grid; gap:12px;
      grid-template-columns: 1fr;
    }
    @media (min-width: 640px) {
      .grid { grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
      body { padding: 16px 20px; }
      .topbar { margin: -16px -20px 16px; padding-left: 20px; padding-right: 20px; }
    }
    .card {
      background:var(--card); border-radius:12px; padding:14px;
      min-width: 0; /* prevent grid blowout */
    }
    .card h2 { font-size:1rem; margin:0 0 10px; }
    button {
      cursor:pointer; border:none; border-radius:10px;
      padding: 12px 14px;
      margin: 0;
      min-height: var(--tap);
      background:#2a2f3a; color:var(--text); font-weight:600;
      font-size: .95rem;
      touch-action: manipulation;
    }
    button:active { transform: scale(0.98); }
    button:hover { background:#3a4150; }
    button.gift { background:#2a1f3d; }
    button.gift:hover { background:#3d2a55; }
    button.danger { background:#4a1520; }
    button.ok { background:#0d3d2a; }
    button.revenge { background:#5a3a00; }
    input[type=number], input[type=text], select {
      background:#111; border:1px solid #333; color:var(--text);
      border-radius:8px; padding:10px 12px;
      min-height: var(--tap);
      font-size: 16px; /* avoid iOS zoom on focus */
      max-width: 100%;
    }
    input[type=number] { width: 88px; }
    input[type=text] { width: 100%; max-width: 220px; flex: 1 1 140px; }
    select { min-width: 0; max-width: 100%; flex: 1 1 160px; }
    label { display:flex; align-items:center; gap:6px; flex-wrap:wrap; font-size:.9rem; }
    #log {
      font-family: ui-monospace, monospace; font-size:.75rem;
      max-height: min(280px, 40vh); overflow:auto;
      background:#0a0c10; padding:10px; border-radius:8px;
      white-space:pre-wrap; word-break: break-word;
      -webkit-overflow-scrolling: touch;
    }
    .row {
      display:flex; flex-wrap:wrap; align-items:center;
      gap:8px; margin-bottom:10px;
    }
    .row > button { flex: 1 1 auto; }
    a { color:#7ab7ff; }
    .dead-btn { font-size:.85rem; min-height: var(--tap); }
    .status-line {
      font-size:.85rem; color:var(--muted);
      word-break: break-word; line-height:1.35;
    }
    #winner { margin-top:6px; color:#ffd60a; font-size:.85rem; word-break:break-word; }
  </style>
</head>
<body>
  <header class="topbar">
    <h1>Ball Arena — Painel DEMO</h1>
    <p class="sub">
      Eventos <strong>simulados</strong>. Morto → <strong>comentário</strong> respawna (vingança se tiver killer).
      Overlay: <a href="/overlay" target="_blank">/overlay</a> ·
      Health: <a href="/health" target="_blank">/health</a>
    </p>
    <div class="badges">
      <span class="badge demo" id="modeBadge">DEMO</span>
      <span class="badge" id="tiktokStatus" style="background:#1a3a2a">tiktok: —</span>
    </div>
    <div class="quick">
      <button class="ok" onclick="post('/admin/round/start')">▶ Iniciar</button>
      <button class="danger" onclick="post('/admin/round/force-end')">⏹ Force end</button>
      <button onclick="post('/admin/round/next')">⏭ Next</button>
      <button onclick="post('/admin/sim/like', { likeCount: 100 })">❤️ +100</button>
    </div>
  </header>

  <div class="grid">
    <div class="card">
      <h2>Rodada</h2>
      <div class="row">
        <button class="ok" onclick="post('/admin/round/start')">▶ Iniciar</button>
        <button class="danger" onclick="post('/admin/round/force-end')">⏹ Force end</button>
        <button onclick="post('/admin/round/next')">⏭ Next round</button>
        <button onclick="post('/admin/round/reset')">↺ Waiting</button>
      </div>
      <div class="row">
        <button onclick="post('/admin/round/set-time', { seconds: 15 })">⏱ 15s</button>
        <button onclick="post('/admin/round/set-time', { seconds: 65 })">⏱ 65s</button>
        <button onclick="post('/admin/round/set-time', { seconds: 300 })">⏱ 5:00</button>
      </div>
      <div id="round" class="status-line">—</div>
      <div id="winner"></div>
    </div>

    <div class="card">
      <h2>Presentes (→ alvo vivo)</h2>
      <div class="row">
        <label>Alvo
          <select id="giftTarget">
            <option value="">último / 1º vivo</option>
          </select>
        </label>
        <label>x<input id="giftRepeat" type="number" value="1" min="1" max="50" style="width:72px" /></label>
      </div>
      <button class="gift" onclick="gift('rosa')">🌹 Rosa (+2HP)</button>
      <button class="gift" onclick="gift('mini_dino')">🦖 Dino Rage</button>
      <button class="gift" onclick="gift('rosquinha')">🍩 Donut</button>
      <button class="gift" onclick="gift('capivara')">🦫 Capivara</button>
      <button class="gift" onclick="gift('galaxia')">🌌 Galaxy</button>
      <div id="giftTargetInfo" style="margin-top:6px;font-size:.8rem;color:var(--muted)">—</div>
    </div>

    <div class="card">
      <h2>Eventos</h2>
      <div class="row">
        <input id="comment" type="text" placeholder="comentário" />
        <button onclick="comment()">💬 Comentário</button>
      </div>
            <button onclick="post('/admin/sim/join')">👋 Join</button>
    </div>

    <div class="card">
      <h2>Combate</h2>
      <button class="danger" onclick="post('/admin/combat/damage', { damage: 25 })">💥 Dano 25</button>
      <button class="danger" onclick="post('/admin/combat/damage', { damage: 50 })">💥 Dano 50</button>
      <button class="danger" onclick="post('/admin/combat/kill')">☠️ Kill (1ª bola)</button>
      <div id="kills" style="margin-top:8px;font-size:.85rem;color:var(--muted)">—</div>
    </div>

    <div class="card">
      <h2>Mortos / Respawn</h2>
      <button class="revenge" onclick="post('/admin/combat/respawn')">♻️ Respawn 1º morto</button>
      <div id="dead" style="margin-top:8px"></div>
    </div>

    <div class="card">
      <h2>Bots & Load test</h2>
      <div class="row">
        <label>N <input id="bots" type="number" value="5" min="1" max="150" /></label>
        <button onclick="bots(false)">👥 Spawn bots</button>
      </div>
      <button onclick="loadtest(50)">🧪 50 bots</button>
      <button onclick="loadtest(100)">🧪 100 bots</button>
      <button class="danger" onclick="loadtest(100, true)">💣 100 + gift spam</button>
      <div class="row" style="margin-top:8px">
        <button onclick="post('/admin/sim/auto', { enabled: false })">Auto OFF</button>
        <button onclick="post('/admin/sim/auto', { enabled: true })">Auto ON</button>
      </div>
    </div>

    <div class="card">
      <h2>Likes / Shares / Eventos</h2>
      <div id="likesMeter" style="font-size:.85rem;color:var(--muted);margin-bottom:8px">likes: —</div>
      <button onclick="post('/admin/sim/like', { likeCount: 50 })">❤️ +50 likes</button>
      <button class="ok" onclick="post('/admin/sim/like', { likeCount: 100 })">❤️ +100 (threshold)</button>
      <button onclick="post('/admin/sim/share')">📢 Share (alvo)</button>
      <div class="row" style="margin-top:8px">
        <button onclick="post('/admin/events/force', { kind: 'heal_rain' })">💚 HEAL RAIN</button>
        <button onclick="post('/admin/events/force', { kind: 'speed_storm' })">⚡ SPEED STORM</button>
        <button onclick="post('/admin/events/force', { kind: 'double_damage' })">💥 DOUBLE DMG</button>
      </div>
      <div class="row">
        <button onclick="post('/admin/events/random', { enabled: true })">Random ON</button>
        <button onclick="post('/admin/events/random', { enabled: false })">Random OFF</button>
      </div>
    </div>
  </div>

  <div class="card" style="margin-top:12px">
    <h2>Log</h2>
    <div id="log"></div>
  </div>

  <script>
    async function post(path, body = {}) {
      const r = await fetch(path, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      const j = await r.json();
      log(JSON.stringify(j).slice(0, 400));
      refresh();
      return j;
    }
    function gift(giftId) {
      const userId = document.getElementById('giftTarget').value || undefined;
      const repeatCount = Number(document.getElementById('giftRepeat').value) || 1;
      return post('/admin/sim/gift', { giftId, userId, repeatCount });
    }
    function comment() {
      return post('/admin/sim/comment', { comment: document.getElementById('comment').value || undefined });
    }
    function loadtest(count, giftSpam) {
      return post('/admin/sim/loadtest', { count, giftSpam: !!giftSpam });
    }
    function bots(withGift) {
      return post('/admin/sim/bots', { count: Number(document.getElementById('bots').value) || 5, withGift });
    }
    function respawnAs(userId) {
      return post('/admin/sim/comment-as', { userId, comment: 'volto por vinganca!' });
    }
    function log(msg) {
      const el = document.getElementById('log');
      el.textContent = new Date().toLocaleTimeString() + ' ' + msg + '\n' + el.textContent;
    }
    async function refresh() {
      const j = await fetch('/admin/status').then(r => r.json());
      const rd = j.round || {};
      const tk = j.tiktok || {};
      const badge = document.getElementById('tiktokStatus');
      if (badge) {
        badge.textContent = `tiktok: ${tk.label || tk.phase || '—'} @${tk.username || '-'}`;
        badge.style.background = tk.live ? '#0d3d2a' : (tk.phase === 'reconnecting' || tk.phase === 'waiting_live' ? '#5a3a00' : '#333');
      }
      const mb = document.getElementById('modeBadge');
      if (mb) { mb.textContent = (j.mode || 'demo').toUpperCase(); mb.className = 'badge ' + (j.mode === 'demo' ? 'demo' : ''); }
      const gl = j.global || {};
      const lm = document.getElementById('likesMeter');
      if (lm) {
        lm.textContent = `likes ${gl.likesAccumulated||0}/${gl.likesThreshold||100} reward=${gl.likesReward||'-'} random=${gl.randomEventsEnabled?'ON':'OFF'} effect=${gl.activeEffect||'-'}`;
      }
      document.getElementById('round').textContent =
        `phase=${rd.phase} rem=${rd.remainingSec}s results=${rd.resultsRemainingSec??'-'} vivos=${rd.playerCount||0} king=${j.kingUserId||'-'}`;
      const w = j.winner;
      document.getElementById('winner').textContent = w
        ? `🏆 ${w.username} K${w.kills}/D${w.deaths} dmg${w.damageDealt} spd${Math.round(w.highestSpeed)}`
        : (j.top5||[]).slice(0,3).map((s,i)=>`#${i+1} ${s.username} ${s.kills}☠`).join(' · ');
      if (j.stats) {
        document.getElementById('kills').textContent = j.stats.slice(0, 8).map(s =>
          `${s.alive?'🟢':'💀'} ${s.username} K:${s.kills} D:${s.deaths} HP:${s.hp}` +
          (s.revengeTargetName ? ` 🎯→${s.revengeTargetName}` : '')
        ).join(' · ') || '—';
      }
      const sel = document.getElementById('giftTarget');
      const prev = sel.value;
      const balls = j.balls || [];
      sel.innerHTML = '<option value="">último / 1º vivo</option>' + balls.map(b =>
        `<option value="${b.userId}">${b.username} HP${b.hp}` +
        (b.shieldHp ? ` 🛡${b.shieldHp}` : '') +
        (b.isGalaxy ? ' 🌌' : '') +
        (b.buffs && b.buffs.length ? ' ['+b.buffs.join(',')+']' : '') +
        `</option>`
      ).join('');
      if (prev && [...sel.options].some(o => o.value === prev)) sel.value = prev;
      const info = balls.find(b => b.userId === sel.value) || balls[0];
      document.getElementById('giftTargetInfo').textContent = info
        ? `${info.username} HP ${info.hp}/${info.maxHp} shield=${info.shieldHp||0} scale=${(info.sizeScale||1).toFixed(2)} buffs=${(info.buffs||[]).join('|')||'-'}`
        : 'Nenhuma bola — spawn bots primeiro';
      const deadEl = document.getElementById('dead');
      const dead = j.dead || [];
      if (!dead.length) deadEl.textContent = 'Nenhum morto';
      else {
        deadEl.innerHTML = dead.map(d =>
          `<div class="row">💀 <b>${d.username}</b> (K${d.kills}/D${d.deaths})` +
          (d.lastKillerName ? ` ← ${d.lastKillerName}` : '') +
          ` <button class="dead-btn ok" onclick="respawnAs('${d.userId}')">💬 Comentar / respawn</button></div>`
        ).join('');
      }
      const combat = (j.recentCombat||[]).slice(-8).reverse().map(e =>
        e.type === 'kill' ? (e.isRevenge ? '⚔️ ' : '☠️ ') + e.message
        : e.type === 'announce' ? '📢 ' + e.message
        : e.type === 'hit' ? `hit ${e.damage}` : e.type
      );
      document.getElementById('log').textContent = combat.join('\n');
    }
    refresh();
    setInterval(refresh, 1500);
  </script>
</body>
</html>
