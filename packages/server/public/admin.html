<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Arena Admin — DEMO</title>
  <style>
    :root { --bg:#0f1115; --card:#1a1d24; --accent:#fe2c55; --ok:#20d68a; --text:#e8eaed; --muted:#9aa0a6; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, sans-serif; background:var(--bg); color:var(--text); padding:20px; }
    h1 { font-size:1.4rem; margin:0 0 4px; }
    .sub { color:var(--muted); margin-bottom:16px; font-size:.9rem; }
    .badge { display:inline-block; padding:2px 8px; border-radius:999px; background:#333; font-size:.75rem; }
    .badge.demo { background:#3d2a00; color:#ffb020; }
    .grid { display:grid; gap:12px; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
    .card { background:var(--card); border-radius:12px; padding:14px; }
    .card h2 { font-size:1rem; margin:0 0 10px; }
    button { cursor:pointer; border:none; border-radius:8px; padding:10px 12px; margin:4px 4px 4px 0; background:#2a2f3a; color:var(--text); font-weight:600; }
    button:hover { background:#3a4150; }
    button.gift { background:#2a1f3d; }
    button.gift:hover { background:#3d2a55; }
    button.danger { background:#4a1520; }
    button.ok { background:#0d3d2a; }
    button.revenge { background:#5a3a00; }
    input[type=number], input[type=text] { background:#111; border:1px solid #333; color:var(--text); border-radius:6px; padding:8px; width:80px; }
    #log { font-family: ui-monospace, monospace; font-size:.75rem; max-height:280px; overflow:auto; background:#0a0c10; padding:10px; border-radius:8px; white-space:pre-wrap; }
    .row { display:flex; flex-wrap:wrap; align-items:center; gap:6px; margin-bottom:8px; }
    a { color:#7ab7ff; }
    .dead-btn { font-size:.8rem; }
  </style>
</head>
<body>
  <h1>Ball Arena — Painel DEMO</h1>
  <p class="sub">
    Eventos <strong>simulados</strong>. Morto → <strong>comentário</strong> respawna (vingança se tiver killer).
    Overlay: <a href="/overlay" target="_blank">/overlay</a> ·
    Health: <a href="/health" target="_blank">/health</a>
    <span class="badge demo" id="modeBadge">DEMO</span>
    <span class="badge" id="tiktokStatus" style="margin-left:6px;background:#1a3a2a">tiktok: —</span>
  </p>

  <div class="grid">
    <div class="card">
      <h2>Rodada</h2>
      <div class="row">
        <button class="ok" onclick="post('/admin/round/start')">▶ Iniciar</button>
        <button class="danger" onclick="post('/admin/round/force-end')">⏹ Force end</button>
        <button onclick="post('/admin/round/next')">⏭ Next round</button>
        <button onclick="post('/admin/round/reset')">↺ Waiting</button>
      </div>
      <div class="row">
        <button onclick="post('/admin/round/set-time', { seconds: 15 })">⏱ 15s</button>
        <button onclick="post('/admin/round/set-time', { seconds: 65 })">⏱ 65s</button>
        <button onclick="post('/admin/round/set-time', { seconds: 300 })">⏱ 5:00</button>
      </div>
      <div id="round">—</div>
      <div id="winner" style="margin-top:6px;color:#ffd60a;font-size:.85rem"></div>
    </div>

    <div class="card">
      <h2>Presentes (→ alvo vivo)</h2>
      <div class="row">
        <label>Alvo
          <select id="giftTarget" style="background:#111;color:#e8eaed;border:1px solid #333;border-radius:6px;padding:6px;min-width:140px">
            <option value="">último / 1º vivo</option>
          </select>
        </label>
        <label>x<input id="giftRepeat" type="number" value="1" min="1" max="50" style="width:56px" /></label>
      </div>
      <button class="gift" onclick="gift('rosa')">🌹 Rosa (+2HP)</button>
      <button class="gift" onclick="gift('mini_dino')">🦖 Dino Rage</button>
      <button class="gift" onclick="gift('rosquinha')">🍩 Donut</button>
      <button class="gift" onclick="gift('capivara')">🦫 Capivara</button>
      <button class="gift" onclick="gift('galaxia')">🌌 Galaxy</button>
      <div id="giftTargetInfo" style="margin-top:6px;font-size:.8rem;color:var(--muted)">—</div>
    </div>

    <div class="card">
      <h2>Eventos</h2>
      <div class="row">
        <input id="comment" type="text" placeholder="comentário" style="width:140px" />
        <button onclick="comment()">💬 Comentário</button>
      </div>
      <button onclick="post('/admin/sim/like', { likeCount: 10 })">❤️ Likes</button>
      <button onclick="post('/admin/sim/join')">👋 Join</button>
    </div>

    <div class="card">
      <h2>Combate</h2>
      <button class="danger" onclick="post('/admin/combat/damage', { damage: 25 })">💥 Dano 25</button>
      <button class="danger" onclick="post('/admin/combat/damage', { damage: 50 })">💥 Dano 50</button>
      <button class="danger" onclick="post('/admin/combat/kill')">☠️ Kill (1ª bola)</button>
      <div id="kills" style="margin-top:8px;font-size:.85rem;color:var(--muted)">—</div>
    </div>

    <div class="card">
      <h2>Mortos / Respawn</h2>
      <button class="revenge" onclick="post('/admin/combat/respawn')">♻️ Respawn 1º morto</button>
      <div id="dead" style="margin-top:8px"></div>
    </div>

    <div class="card">
      <h2>Bots & conexão</h2>
      <div class="row">
        <label>N <input id="bots" type="number" value="5" min="1" max="50" /></label>
        <button onclick="bots(false)">👥 Spawn bots</button>
      </div>
      <button onclick="post('/admin/sim/auto', { enabled: false })">Auto OFF</button>
      <button onclick="post('/admin/sim/auto', { enabled: true })">Auto ON</button>
    </div>
  </div>

  <div class="card" style="margin-top:12px">
    <h2>Log</h2>
    <div id="log"></div>
  </div>

  <script>
    async function post(path, body = {}) {
      const r = await fetch(path, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      const j = await r.json();
      log(JSON.stringify(j).slice(0, 400));
      refresh();
      return j;
    }
    function gift(giftId) {
      const userId = document.getElementById('giftTarget').value || undefined;
      const repeatCount = Number(document.getElementById('giftRepeat').value) || 1;
      return post('/admin/sim/gift', { giftId, userId, repeatCount });
    }
    function comment() {
      return post('/admin/sim/comment', { comment: document.getElementById('comment').value || undefined });
    }
    function bots(withGift) {
      return post('/admin/sim/bots', { count: Number(document.getElementById('bots').value) || 5, withGift });
    }
    function respawnAs(userId) {
      return post('/admin/sim/comment-as', { userId, comment: 'volto por vinganca!' });
    }
    function log(msg) {
      const el = document.getElementById('log');
      el.textContent = new Date().toLocaleTimeString() + ' ' + msg + '\n' + el.textContent;
    }
    async function refresh() {
      const j = await fetch('/admin/status').then(r => r.json());
      const rd = j.round || {};
      const tk = j.tiktok || {};
      const badge = document.getElementById('tiktokStatus');
      if (badge) {
        badge.textContent = `tiktok: ${tk.label || tk.phase || '—'} @${tk.username || '-'}`;
        badge.style.background = tk.live ? '#0d3d2a' : (tk.phase === 'reconnecting' || tk.phase === 'waiting_live' ? '#5a3a00' : '#333');
      }
      const mb = document.getElementById('modeBadge');
      if (mb) { mb.textContent = (j.mode || 'demo').toUpperCase(); mb.className = 'badge ' + (j.mode === 'demo' ? 'demo' : ''); }
      document.getElementById('round').textContent =
        `phase=${rd.phase} rem=${rd.remainingSec}s results=${rd.resultsRemainingSec??'-'} vivos=${rd.playerCount||0} king=${j.kingUserId||'-'}`;
      const w = j.winner;
      document.getElementById('winner').textContent = w
        ? `🏆 ${w.username} K${w.kills}/D${w.deaths} dmg${w.damageDealt} spd${Math.round(w.highestSpeed)}`
        : (j.top5||[]).slice(0,3).map((s,i)=>`#${i+1} ${s.username} ${s.kills}☠`).join(' · ');
      if (j.stats) {
        document.getElementById('kills').textContent = j.stats.slice(0, 8).map(s =>
          `${s.alive?'🟢':'💀'} ${s.username} K:${s.kills} D:${s.deaths} HP:${s.hp}` +
          (s.revengeTargetName ? ` 🎯→${s.revengeTargetName}` : '')
        ).join(' · ') || '—';
      }
      const sel = document.getElementById('giftTarget');
      const prev = sel.value;
      const balls = j.balls || [];
      sel.innerHTML = '<option value="">último / 1º vivo</option>' + balls.map(b =>
        `<option value="${b.userId}">${b.username} HP${b.hp}` +
        (b.shieldHp ? ` 🛡${b.shieldHp}` : '') +
        (b.isGalaxy ? ' 🌌' : '') +
        (b.buffs && b.buffs.length ? ' ['+b.buffs.join(',')+']' : '') +
        `</option>`
      ).join('');
      if (prev && [...sel.options].some(o => o.value === prev)) sel.value = prev;
      const info = balls.find(b => b.userId === sel.value) || balls[0];
      document.getElementById('giftTargetInfo').textContent = info
        ? `${info.username} HP ${info.hp}/${info.maxHp} shield=${info.shieldHp||0} scale=${(info.sizeScale||1).toFixed(2)} buffs=${(info.buffs||[]).join('|')||'-'}`
        : 'Nenhuma bola — spawn bots primeiro';
      const deadEl = document.getElementById('dead');
      const dead = j.dead || [];
      if (!dead.length) deadEl.textContent = 'Nenhum morto';
      else {
        deadEl.innerHTML = dead.map(d =>
          `<div class="row">💀 <b>${d.username}</b> (K${d.kills}/D${d.deaths})` +
          (d.lastKillerName ? ` ← ${d.lastKillerName}` : '') +
          ` <button class="dead-btn ok" onclick="respawnAs('${d.userId}')">💬 Comentar / respawn</button></div>`
        ).join('');
      }
      const combat = (j.recentCombat||[]).slice(-8).reverse().map(e =>
        e.type === 'kill' ? (e.isRevenge ? '⚔️ ' : '☠️ ') + e.message
        : e.type === 'announce' ? '📢 ' + e.message
        : e.type === 'hit' ? `hit ${e.damage}` : e.type
      );
      document.getElementById('log').textContent = combat.join('\n');
    }
    refresh();
    setInterval(refresh, 1500);
  </script>
</body>
</html>
